# Tracked tokens — Mantis Money TradingView watchlist.
# Used to canonicalise entity extraction in GraphRAG and to filter prediction
# outputs before they reach the Mantis execution agents.
#
# categories: l1 | l2 | stablecoin | governance | meme | gaming | rwa | ai | defi
# chains lists every chain where the token has meaningful liquidity.
# Flag `verify: true` where chain/category needs human confirmation.

